<script>
// ============================================
// MOTOR SEGURO v11 - Arquitectura Hexagonal + Plugin Alquimia Digital
// ============================================
(function() {
"use strict";

// ---------------------------------------------------------------
// 1. NÚCLEO DE EVENTOS
// ---------------------------------------------------------------
class EventBus {
    constructor() { this._listeners = {}; }
    on(event, callback) {
        if (!this._listeners[event]) this._listeners[event] = [];
        this._listeners[event].push(callback);
        return () => this.off(event, callback);
    }
    off(event, callback) {
        const lst = this._listeners[event];
        if (lst) this._listeners[event] = lst.filter(cb => cb !== callback);
    }
    emit(event, data) {
        (this._listeners[event] || []).forEach(cb => { try { cb(data); } catch(e) { console.error(e); } });
    }
}

// ---------------------------------------------------------------
// 2. ESTADO DEL CURSO (inmutable)
// ---------------------------------------------------------------
class EstadoCurso {
    constructor(curso = null) {
        this.curso = curso;
        this.moduloActual = 0;
        this.leccionActual = 0;
        this.historial = [];
    }
    get leccionActualObj() {
        if (!this.curso) return null;
        const mod = this.curso.modulos[this.moduloActual];
        return mod ? mod.lecciones[this.leccionActual] : null;
    }
    navegarA(idLeccion) {
        const { modIdx, lecIdx } = this._buscarLeccion(idLeccion);
        if (modIdx === -1) return this;
        const nuevo = this.clone();
        nuevo.moduloActual = modIdx;
        nuevo.leccionActual = lecIdx;
        nuevo.historial = [...this.historial, { modulo: this.moduloActual, leccion: this.leccionActual }];
        return nuevo;
    }
    _buscarLeccion(id) {
        for (let m = 0; m < this.curso.modulos.length; m++) {
            const lecs = this.curso.modulos[m].lecciones;
            for (let l = 0; l < lecs.length; l++) {
                if (lecs[l].id === id) return { modIdx: m, lecIdx: l };
            }
        }
        return { modIdx: -1, lecIdx: -1 };
    }
    clone() {
        const nuevo = new EstadoCurso(this.curso);
        nuevo.moduloActual = this.moduloActual;
        nuevo.leccionActual = this.leccionActual;
        nuevo.historial = [...this.historial];
        return nuevo;
    }
}

// ---------------------------------------------------------------
// 3. MOTOR DE NAVEGACIÓN (intérprete de grafos)
// ---------------------------------------------------------------
class MotorNavegacion {
    constructor(estadoInicial, bus) {
        this.estado = estadoInicial;
        this.bus = bus;
        this._setupListeners();
    }
    _setupListeners() {
        this.bus.on('navegar:siguiente', () => this.siguiente());
        this.bus.on('navegar:anterior', () => this.anterior());
        this.bus.on('navegar:a', (id) => this.irA(id));
        this.bus.on('plugin:accion', ({accion, destino}) => {
            if (accion === 'siguiente' && destino) this.irA(destino);
            else if (accion === 'repetir') this.irA(this.estado.leccionActualObj?.id);
        });
    }
    siguiente() {
        const lec = this.estado.leccionActualObj;
        if (!lec) return;
        if (lec.siguiente) return this.irA(lec.siguiente);
        const mod = this.estado.curso.modulos[this.estado.moduloActual];
        if (this.estado.leccionActual < mod.lecciones.length - 1) {
            const nuevo = this.estado.clone();
            nuevo.leccionActual++;
            this._actualizarEstado(nuevo);
        } else if (this.estado.moduloActual < this.estado.curso.modulos.length - 1) {
            const nuevo = this.estado.clone();
            nuevo.moduloActual++;
            nuevo.leccionActual = 0;
            this._actualizarEstado(nuevo);
        }
    }
    anterior() {
        if (this.estado.historial.length > 0) {
            const ant = this.estado.historial.pop();
            const nuevo = this.estado.clone();
            nuevo.moduloActual = ant.modulo;
            nuevo.leccionActual = ant.leccion;
            this._actualizarEstado(nuevo);
        }
    }
    irA(id) {
        if (!id) return;
        const nuevo = this.estado.navegarA(id);
        if (nuevo !== this.estado) this._actualizarEstado(nuevo);
    }
    _actualizarEstado(nuevo) {
        this.estado = nuevo;
        this.bus.emit('estado:cambiado', this.estado);
    }
}

// ---------------------------------------------------------------
// 4. EXAMINADOR DE ARCHIVOS (parsea YAML/JSON/TXT)
// ---------------------------------------------------------------
class ExaminadorArchivos {
    static parsear(contenido, nombre) {
        const ext = nombre.split('.').pop().toLowerCase();
        if (ext === 'yaml' || ext === 'yml') return this._desdeYAML(contenido);
        if (ext === 'json') return this._desdeJSON(contenido);
        if (ext === 'txt') return this._desdeTXT(contenido);
        throw new Error(`Formato no soportado: .${ext}`);
    }
    static _desdeYAML(txt) { return this._validar(jsyaml.load(txt)); }
    static _desdeJSON(txt) { return this._validar(JSON.parse(txt)); }
    static _desdeTXT(txt) { /* simplificado */ return this._validar({modulos:[]}); }
    static _validar(data) {
        if (!data || !Array.isArray(data.modulos)) throw new Error('Falta "modulos"');
        data.modulos.forEach((mod, mi) => {
            if (!mod.lecciones) mod.lecciones = [];
            mod.lecciones.forEach((lec, li) => {
                if (!lec.id) lec.id = `mod${mi}_lec${li}`;
                if (!lec.titulo) lec.titulo = `Lección ${li+1}`;
                lec.contenido = lec.contenido || '';
                lec.plugin = lec.plugin || null;
                lec.config = lec.config || {};
            });
        });
        return data;
    }
}

// ---------------------------------------------------------------
// 5. CATÁLOGO DE PLUGINS MAESTROS
// ---------------------------------------------------------------
class CargadorCatalogo {
    constructor(json) {
        this.plugins = {};
        if (json && json.plugins) {
            json.plugins.forEach(p => { if (p.id && p.codigo) this.plugins[p.id] = p; });
        }
    }
    obtener(id) { return this.plugins[id] || null; }
}

// ---------------------------------------------------------------
// 6. GESTOR DE PLUGINS (inyecta código en iframe)
// ---------------------------------------------------------------
class GestorPlugins {
    constructor(catalogo, bus) { this.catalogo = catalogo; this.bus = bus; }
    ejecutar(leccion, iframe) {
        if (!leccion.plugin || !iframe) return;
        const plugin = this.catalogo.obtener(leccion.plugin);
        if (!plugin) { console.warn('Plugin no encontrado:', leccion.plugin); return; }
        const cfg = JSON.stringify(leccion.config || {});
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
            body{ margin:0; overflow:hidden; background:#0f172a; font-family:system-ui; }
            canvas{ display:block; touch-action:none; }
            #analyze-btn{ position:absolute; bottom:20px; right:20px; background:#2563eb; color:white; border:none; padding:12px 20px; border-radius:30px; font-weight:bold; cursor:pointer; z-index:10; }
            #palette{ position:absolute; top:20px; left:20px; display:flex; gap:10px; z-index:10; flex-wrap:wrap; max-width:60%; }
            .palette-atom{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; user-select:none; border:2px solid #ffffff40; }
        </style></head><body>
            <div id="palette"></div>
            <button id="analyze-btn">🔍 Analizar</button>
            <canvas id="alchemy-canvas"></canvas>
            <script>
                window.CONFIG = ${cfg};
                window.callbacks = {
                    onAccion: (accion, destino) => window.parent.postMessage({type:'plugin:accion', accion, destino}, '*'),
                    log: (msg) => window.parent.postMessage({type:'plugin:log', msg}, '*')
                };
                // El código del plugin se inyecta a continuación
                ${plugin.codigo}
            <\/script>
        </body></html>`;
        iframe.srcdoc = html;
    }
}

// ---------------------------------------------------------------
// 7. PERSISTENCIA
// ---------------------------------------------------------------
class Persistencia {
    guardar(clave, datos) { localStorage.setItem('ms11_'+clave, JSON.stringify(datos)); }
    cargar(clave) { const v = localStorage.getItem('ms11_'+clave); return v ? JSON.parse(v) : null; }
}

// ---------------------------------------------------------------
// 8. RENDERIZADOR (UI principal)
// ---------------------------------------------------------------
class Renderizador {
    constructor(bus, els) {
        this.bus = bus; this.els = els;
        bus.on('estado:cambiado', estado => this._render(estado));
    }
    _render(estado) {
        const lec = estado.leccionActualObj;
        if (!lec) return;
        this.els.lessonTitle.innerText = lec.titulo;
        const mod = estado.curso.modulos[estado.moduloActual];
        this.els.lessonCounter.innerText = mod.nombre + ' · ' + (estado.leccionActual+1) + '/' + mod.lecciones.length;
        this.els.lessonContent.innerHTML = this._md(lec.contenido);
        if (lec.plugin) {
            this.els.pluginZone.classList.remove('hidden');
            this.bus.emit('plugin:ejecutar', lec);
        } else {
            this.els.pluginZone.classList.add('hidden');
        }
        const total = estado.curso.modulos.reduce((a,m) => a+m.lecciones.length, 0);
        const global = estado.curso.modulos.slice(0, estado.moduloActual).reduce((a,m)=>a+m.lecciones.length,0) + estado.leccionActual+1;
        this.els.progressText.innerText = 'Lección ' + global + ' de ' + total;
        this.els.prevBtn.disabled = (estado.moduloActual===0 && estado.leccionActual===0);
        const lastMod = estado.curso.modulos[estado.curso.modulos.length-1];
        const esUltima = (estado.moduloActual===estado.curso.modulos.length-1 && estado.leccionActual===lastMod.lecciones.length-1);
        this.els.nextBtn.disabled = esUltima;
        this._renderTabs(estado);
    }
    _renderTabs(estado) {
        this.els.moduleTabs.innerHTML = '';
        estado.curso.modulos.forEach((mod, idx) => {
            const btn = document.createElement('button');
            btn.className = 'module-tab' + (idx===estado.moduloActual?' active':'');
            btn.innerText = mod.nombre;
            btn.onclick = () => this.bus.emit('ui:cambiarModulo', idx);
            this.els.moduleTabs.appendChild(btn);
        });
    }
    _md(txt) {
        if (!txt) return '';
        return txt.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
                  .replace(/`(.+?)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
    }
}

// ---------------------------------------------------------------
// 9. CATÁLOGO DE PLUGINS (datos)
// ---------------------------------------------------------------
const CATALOGO_BASE = {
    plugins: [
        {
            id: "alquimia_digital",
            nombre: "Alquimia Digital - Laboratorio Molecular",
            config_schema: { required: ["atomos_disponibles"] },
            codigo: `
// ============================================
// PLUGIN: Alquimia Digital (motor gráfico interno)
// ============================================
(function() {
    const canvas = document.getElementById('alchemy-canvas');
    const ctx = canvas.getContext('2d');

    // --- Configuración desde el curso ---
    const availableAtoms = CONFIG.atomos_disponibles || ['C','H','O'];
    const targetCompounds = CONFIG.compuestos_objetivo || [];

    // --- Datos químicos ---
    const ATOM_DATA = {
        'C': { color: '#333333', radius: 20, valence: 4, mass: 12 },
        'H': { color: '#ffffff', radius: 15, valence: 1, mass: 1 },
        'O': { color: '#ef4444', radius: 18, valence: 2, mass: 16 },
        'N': { color: '#3b82f6', radius: 18, valence: 3, mass: 14 },
        'Cl':{ color: '#22c55e', radius: 18, valence: 1, mass: 35.5 }
    };

    // --- Base de datos de compuestos (isómeros del C4H10O) ---
    const COMPOUND_DB = [
        {
            name: "butan-1-ol",
            formula: "C4H10O",
            graph: [
                { atom:'C', bonds:[1] },
                { atom:'C', bonds:[0,2] },
                { atom:'C', bonds:[1,3] },
                { atom:'C', bonds:[2,4] },
                { atom:'O', bonds:[3] }
            ],
            group: "alcohol"
        },
        {
            name: "butan-2-ol",
            formula: "C4H10O",
            graph: [
                { atom:'C', bonds:[1] },
                { atom:'C', bonds:[0,2,4] },
                { atom:'C', bonds:[1,3] },
                { atom:'C', bonds:[2] },
                { atom:'O', bonds:[1] }
            ],
            group: "alcohol"
        },
        {
            name: "metilpropan-1-ol",
            formula: "C4H10O",
            graph: [
                { atom:'C', bonds:[1,2,3] },
                { atom:'C', bonds:[0] },
                { atom:'C', bonds:[0] },
                { atom:'C', bonds:[0,4] },
                { atom:'O', bonds:[3] }
            ],
            group: "alcohol"
        },
        {
            name: "metilpropan-2-ol",
            formula: "C4H10O",
            graph: [
                { atom:'C', bonds:[1,2,3] },
                { atom:'C', bonds:[0] },
                { atom:'C', bonds:[0] },
                { atom:'C', bonds:[0,4] },
                { atom:'O', bonds:[3] }
            ],
            group: "alcohol"
        }
    ];

    // --- Estado de la escena ---
    let atoms = [];            // { id, symbol, x, y, z, bonds:[] }
    let nextAtomId = 0;
    let selectedAtom = null;
    let dragAtom = null;      // átomo siendo arrastrado
    let isDragging = false;
    let dragStart = null;
    let cameraAngle = Math.PI/6;  // ángulo isométrico
    let cameraZoom = 1.0;

    // --- Inicializar canvas ---
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 500; // fijo
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Construir paleta de átomos ---
    const paletteDiv = document.getElementById('palette');
    availableAtoms.forEach(sym => {
        const btn = document.createElement('div');
        btn.className = 'palette-atom';
        btn.style.backgroundColor = ATOM_DATA[sym]?.color || '#888';
        btn.innerText = sym;
        btn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            // Crear nuevo átomo en el centro de la vista
            const newAtom = {
                id: nextAtomId++,
                symbol: sym,
                x: (Math.random()-0.5)*100,
                y: (Math.random()-0.5)*100,
                z: (Math.random()-0.5)*100,
                bonds: []
            };
            atoms.push(newAtom);
            drawScene();
            selectedAtom = newAtom;
        });
        paletteDiv.appendChild(btn);
    });

    // --- Proyección isométrica ---
    function isoProject(ax, ay, az) {
        const cos = Math.cos(cameraAngle);
        const sin = Math.sin(cameraAngle);
        const px = (ax - az) * cos * cameraZoom;
        const py = (-ax*0.5 - az*0.5) * sin * cameraZoom + ay * cameraZoom;
        return { px, py };
    }

    // --- Dibujar escena ---
    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width/2;
        const cy = canvas.height/2;

        // Dibujar enlaces
        const drawn = new Set();
        atoms.forEach(atom => {
            atom.bonds.forEach(bondId => {
                const other = atoms.find(a => a.id === bondId);
                if (!other) return;
                const key = atom.id < other.id ? atom.id+'-'+other.id : other.id+'-'+atom.id;
                if (drawn.has(key)) return;
                drawn.add(key);
                const p1 = isoProject(atom.x, atom.y, atom.z);
                const p2 = isoProject(other.x, other.y, other.z);
                ctx.beginPath();
                ctx.moveTo(cx + p1.px, cy - p1.py);
                ctx.lineTo(cx + p2.px, cy - p2.py);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        });

        // Dibujar átomos
        atoms.forEach(atom => {
            const p = isoProject(atom.x, atom.y, atom.z);
            const screenX = cx + p.px;
            const screenY = cy - p.py;
            const radius = ATOM_DATA[atom.symbol]?.radius || 16;
            ctx.beginPath();
            ctx.arc(screenX, screenY, radius, 0, Math.PI*2);
            ctx.fillStyle = ATOM_DATA[atom.symbol]?.color || '#aaa';
            ctx.fill();
            ctx.strokeStyle = atom === selectedAtom ? '#fbbf24' : '#ffffff';
            ctx.lineWidth = atom === selectedAtom ? 3 : 1;
            ctx.stroke();
            ctx.fillStyle = atom.symbol === 'C' ? '#ffffff' : '#000000';
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(atom.symbol, screenX, screenY);
        });
    }

    // --- Lógica de enlace (conecta dos átomos si valencias libres) ---
    function createBond(atom1, atom2) {
        const a1data = ATOM_DATA[atom1.symbol];
        const a2data = ATOM_DATA[atom2.symbol];
        if (!a1data || !a2data) return false;
        if (atom1.bonds.length >= a1data.valence || atom2.bonds.length >= a2data.valence) {
            window.callbacks.log?.('Valencia máxima alcanzada');
            return false;
        }
        if (atom1.bonds.includes(atom2.id)) return false; // ya conectados
        atom1.bonds.push(atom2.id);
        atom2.bonds.push(atom1.id);
        drawScene();
        return true;
    }

    // --- Análisis de molécula (grafo) ---
    function analyzeMolecule() {
        if (atoms.length === 0) return;
        // Construir representación similar a la base de datos
        const graph = atoms.map(atom => ({
            atom: atom.symbol,
            bonds: atom.bonds.map(bid => atoms.findIndex(a => a.id === bid))
        }));
        // Comparar con cada compuesto de la DB (isomorfismo simple: mismo número de átomos y mismo patrón de conectividad)
        const atomCounts = {};
        atoms.forEach(a => atomCounts[a.symbol] = (atomCounts[a.symbol]||0)+1);
        for (let comp of COMPOUND_DB) {
            // Comprobar fórmula
            const compCounts = {};
            comp.graph.forEach(n => compCounts[n.atom] = (compCounts[n.atom]||0)+1);
            if (JSON.stringify(atomCounts) !== JSON.stringify(compCounts)) continue;
            // Comprobar conectividad (comparar listas de grados)
            const degrees1 = graph.map(n => n.bonds.length).sort((a,b)=>a-b);
            const degrees2 = comp.graph.map(n => n.bonds.length).sort((a,b)=>a-b);
            if (JSON.stringify(degrees1) === JSON.stringify(degrees2)) {
                window.callbacks.log?.('✅ Coincide: ' + comp.name);
                if (targetCompounds.includes(comp.name)) {
                    window.callbacks.onAccion?.('siguiente', '');
                }
                return;
            }
        }
        window.callbacks.log?.('❌ No coincide con ningún isómero conocido');
    }

    document.getElementById('analyze-btn').addEventListener('click', analyzeMolecule);

    // --- Manejo de entrada táctil/ratón ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
        const pos = getPos(e);
        const cx = canvas.width/2, cy = canvas.height/2;
        // Buscar átomo cercano
        let closest = null, minDist = 30;
        atoms.forEach(atom => {
            const p = isoProject(atom.x, atom.y, atom.z);
            const dx = (cx + p.px) - pos.x;
            const dy = (cy - p.py) - pos.y;
            const d = Math.sqrt(dx*dx+dy*dy);
            if (d < minDist) { minDist = d; closest = atom; }
        });
        if (closest) {
            if (selectedAtom && selectedAtom !== closest) {
                // Intentar crear enlace
                createBond(selectedAtom, closest);
                selectedAtom = null;
            } else {
                selectedAtom = closest;
            }
            dragAtom = closest;
            isDragging = false;
            dragStart = pos;
            drawScene();
        } else {
            selectedAtom = null;
            dragAtom = null;
            drawScene();
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!dragAtom) return;
        const pos = getPos(e);
        if (dragStart && Math.hypot(pos.x-dragStart.x, pos.y-dragStart.y) > 3) isDragging = true;
        if (isDragging) {
            const dx = pos.x - (dragStart?.x || pos.x);
            const dy = pos.y - (dragStart?.y || pos.y);
            dragAtom.x += dx * 0.1;
            dragAtom.y += dy * 0.1;
            dragStart = pos;
            drawScene();
        }
    });

    canvas.addEventListener('pointerup', () => {
        dragAtom = null;
        isDragging = false;
    });

    // Giro de cámara con arrastre del fondo (si no hay átomo seleccionado)
    canvas.addEventListener('pointerdown', (e) => {
        if (dragAtom) return;
        // Iniciar giro
        const startPos = getPos(e);
        function onMove(ev) {
            const p = getPos(ev);
            cameraAngle += (p.x - startPos.x) * 0.005;
            drawScene();
        }
        function onUp() {
            canvas.removeEventListener('pointermove', onMove);
            canvas.removeEventListener('pointerup', onUp);
        }
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', onUp);
    });

    // Redibujar cada frame (bucle simple)
    function loop() {
        drawScene();
        requestAnimationFrame(loop);
    }
    loop();
})();
`
        }
    ]
};

// 10. ORQUESTADOR (App)
// ---------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
    const bus = new EventBus();
    const persistencia = new Persistencia();
    const catalogo = new CargadorCatalogo(CATALOGO_BASE);

    const elements = {
        moduleTabs: document.getElementById('moduleTabs'),
        lessonTitle: document.getElementById('lessonTitle'),
        lessonContent: document.getElementById('lessonContent'),
        lessonCounter: document.getElementById('lessonCounter'),
        pluginZone: document.getElementById('pluginZone'),
        pluginFrame: document.getElementById('pluginFrame'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        progressText: document.getElementById('progressText'),
        currentFileBadge: document.getElementById('currentFileBadge'),
        errorDisplay: document.getElementById('errorDisplay'),
        courseContainer: document.getElementById('courseContainer'),
        fileInput: document.getElementById('fileInput')
    };

    // Curso por defecto (isomería)
    const defaultYaml = `
titulo: Isomería de Alcoholes
modulos:
  - nombre: Isómeros del C4H10O
    lecciones:
      - id: intro
        titulo: Introducción a la isomería
        contenido: |
          Los compuestos con fórmula **C4H10O** pueden ser alcoholes o éteres.
          Construye los cuatro alcoholes isómeros usando el laboratorio digital.
          Arrastra átomos desde la paleta, únelos y analiza la molécula.
        siguiente: laboratorio
      - id: laboratorio
        titulo: Laboratorio de construcción molecular
        contenido: |
          Construye los isómeros **butan-1-ol**, **butan-2-ol**, **metilpropan-1-ol** y **metilpropan-2-ol**.
          Gira la vista deslizando el fondo, arrastra átomos y conéctalos.
          Pulsa **Analizar** para comprobar.
        plugin: alquimia_digital
        config:
          atomos_disponibles: [C, H, O]
          compuestos_objetivo: [butan-1-ol, butan-2-ol, metilpropan-1-ol, metilpropan-2-ol]
        siguiente: fin
      - id: fin
        titulo: ¡Completado!
        contenido: |
          Has explorado la isomería de los alcoholes.
          Recuerda que la estructura molecular determina las propiedades.
    `;

    // Cargar curso
    let cursoData;
    try {
        cursoData = ExaminadorArchivos._desdeYAML(defaultYaml);
    } catch(e) { console.error(e); }
    let estadoInicial = new EstadoCurso(cursoData);

    // Persistencia
    const saved = persistencia.cargar('progreso');
    if (saved && saved.curso) {
        estadoInicial = new EstadoCurso(saved.curso);
        estadoInicial.moduloActual = saved.moduloActual || 0;
        estadoInicial.leccionActual = saved.leccionActual || 0;
    }

    const motor = new MotorNavegacion(estadoInicial, bus);
    const gestorPlugins = new GestorPlugins(catalogo, bus);
    const renderizador = new Renderizador(bus, elements);

    bus.on('estado:cambiado', (est) => {
        persistencia.guardar('progreso', { curso: est.curso, moduloActual: est.moduloActual, leccionActual: est.leccionActual });
    });
    bus.on('plugin:ejecutar', (leccion) => {
        gestorPlugins.ejecutar(leccion, elements.pluginFrame);
    });
    bus.on('ui:cambiarModulo', (idx) => {
        const nuevo = motor.estado.clone();
        nuevo.moduloActual = idx;
        nuevo.leccionActual = 0;
        motor._actualizarEstado(nuevo);
    });

    window.addEventListener('message', (e) => {
        if (e.data?.type === 'plugin:accion') {
            bus.emit('plugin:accion', { accion: e.data.accion, destino: e.data.destino });
        } else if (e.data?.type === 'plugin:log') {
            console.log('[Plugin]', e.data.msg);
        }
    });

    elements.prevBtn.onclick = () => bus.emit('navegar:anterior');
    elements.nextBtn.onclick = () => bus.emit('navegar:siguiente');

    elements.fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const nuevoCurso = ExaminadorArchivos.parsear(ev.target.result, file.name);
                const nuevoEstado = new EstadoCurso(nuevoCurso);
                motor._actualizarEstado(nuevoEstado);
                elements.errorDisplay.style.display = 'none';
                elements.courseContainer.style.display = 'block';
            } catch(ex) {
                elements.errorDisplay.style.display = 'block';
                elements.errorDisplay.innerHTML = 'Error: ' + ex.message;
            }
        };
        reader.readAsText(file);
    };

    // Render inicial
    renderizador._render(motor.estado);
});

})();
